[project]
name = "jev-distill-deberta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martin76ec", email = "larreaamartin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "matplotlib>=3.11.2",
    "peft>=0.21.1",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "torchao>=0.18.0",
    "transformers>=5.18.0",
]

[project.scripts]
jev-distill-deberta = "jev_distill_deberta:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
